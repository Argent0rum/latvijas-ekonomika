# Maintenance helper: Actions → "Izpētīt Eurostat datu kopas" → Run workflow, enter dataset codes.
# Saves each dataset's dimensions and codes to izpete/rezultats.txt (useful when adding a new indicator).
name: Izpētīt Eurostat datu kopas

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Eurostat dataset codes, separated by spaces"
        required: true
        default: "une_rt_m"

permissions:
  contents: write

jobs:
  izpete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: |
          mkdir -p izpete
          python scripts/izpete.py ${{ github.event.inputs.datasets }} | tee izpete/rezultats.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add izpete
          git diff --cached --quiet || (git commit -m "Datu kopu izpētes rezultāts" && git push)
